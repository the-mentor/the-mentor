name: Update README ✍️

# Regenerates README.md from templates/README.md.tpl on a schedule.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  readme-scribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      # Runs markscribe directly rather than via the muesli/readme-scribe
      # action. That action is a thin wrapper whose action.yml invokes
      # `docker://fribbledom/markscribe` with NO tag, i.e. :latest — so
      # pinning the action's SHA pinned the wrapper, not the image that
      # actually executes with the PAT in its environment. Pinning the image
      # digest closes that gap.
      #
      # Digest is the amd64 image behind fribbledom/markscribe:latest
      # (the only tag; pushed 2021-06-22). Verify a new one with:
      #   curl -s https://hub.docker.com/v2/repositories/fribbledom/markscribe/tags/latest
      - name: Generate README.md
        env:
          # MUST be a classic PAT, not the default GITHUB_TOKEN: the activity
          # data comes from the GraphQL API, which GITHUB_TOKEN cannot read.
          # Scope: read:user only — see SETUP.md. Do NOT add public_repo;
          # it grants write access to every public repo you own.
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        run: |
          docker run --rm \
            -e GITHUB_TOKEN \
            -v "${{ github.workspace }}:/workspace" \
            -w /workspace \
            fribbledom/markscribe@sha256:97576ac6779e1be65eb9a11a241f5b873b4eae065cd9a9e1f1241add2cae60f4 \
            -write README.md templates/README.md.tpl

      - name: Commit README.md
        uses: stefanzweifel/git-auto-commit-action@4a55954c782fc1ea30b9056cd3e7a2b40ca8887d # v7
        with:
          commit_message: "docs: update README.md"
          branch: main
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
