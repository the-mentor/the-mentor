name: Update README ✍️

# Regenerates README.md from templates/README.md.tpl on a schedule.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 */1 * * *"
  workflow_dispatch:

jobs:
  readme-scribe:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v6

      - name: Generate README.md
        uses: muesli/readme-scribe@v0.1
        env:
          # NOTE: this MUST be a classic Personal Access Token, not the default
          # GITHUB_TOKEN. The contributions/stars/sponsors data comes from the
          # GitHub GraphQL API, which GITHUB_TOKEN cannot read.
          # Scopes needed: public_repo, read:user  (+ read:org for org activity)
          GITHUB_TOKEN: ${{ secrets.PERSONAL_GITHUB_TOKEN }}
        with:
          template: "templates/README.md.tpl"
          writeTo: "README.md"

      - name: Commit README.md
        uses: stefanzweifel/git-auto-commit-action@v7
        with:
          commit_message: "docs: update README.md"
          branch: main
          commit_user_name: GitHub Actions
          commit_user_email: actions@github.com
          commit_author: GitHub Actions <actions@github.com>
