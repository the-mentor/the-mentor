name: Generate snake animation 🐍

# Run daily at 01:00 UTC
on:
  schedule:
    - cron: "0 01 * * *"
  workflow_dispatch:

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Turn the contribution graph into a snake game animation
      - name: Generate snake animations
        uses: Platane/snk/svg-only@d8f6715049803e982ee5ff501b6b9b7d5deeb09b # v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            build/github-contribution-grid-snake.svg?color_snake=#39FF14&color_dots=#E8FFE8,#A8F09A,#5FD94E,#2BBF1B,#0E7A0E
            build/github-contribution-grid-snake-dark.svg?color_snake=#39FF14&color_dots=#050A05,#0A3D0A,#0E7A0E,#1FD10F,#2BE80F

      # Publish build/ to an orphan "snake" branch, so the SVGs are reachable at
      # https://raw.githubusercontent.com/<user>/<repo>/snake/<file>
      - name: Push snake animations
        uses: crazy-max/ghaction-github-pages@df5cc2bfa78282ded844b354faee141f06b41865 # v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_dir: build
          target_branch: snake
