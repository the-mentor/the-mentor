name: Generate snake animation 🐍

# Run daily at 01:00 UTC
on:
  schedule:
    - cron: "0 01 * * *"
  workflow_dispatch:

jobs:
  snake:
    permissions:
      contents: write
    runs-on: ubuntu-latest
    steps:
      # Turn the contribution graph into a snake game animation
      - name: Generate snake animations
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            build/github-contribution-grid-snake.svg?color_snake=#f778ba&color_dots=#EBEDF0,#C4E4CB,#9DDBA6,#6BC77C,#39D353
            build/github-contribution-grid-snake-dark.svg?color_snake=#f778ba&color_dots=#161B22,#1C4A2A,#226E33,#2CA143,#39D353

      # Publish build/ to an orphan "snake" branch, so the SVGs are reachable at
      # https://raw.githubusercontent.com/<user>/<repo>/snake/<file>
      - name: Push snake animations
        uses: crazy-max/ghaction-github-pages@v4.2.0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          build_dir: build
          target_branch: snake
