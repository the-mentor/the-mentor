name: Commit policy 🔒

# Detection, not prevention. GitHub gates commit-metadata rulesets — which reject
# a push server-side — to organization-owned repositories on Team or Enterprise.
# This account is personal, so the API rejects those rules (422) and the earliest
# a violation can be caught here is after the commit has landed. Fixing one still
# means a history rewrite; the local hook in .githooks/ is what actually prevents.
on:
  push:
  pull_request:

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0

      - name: Check commit messages and authorship
        env:
          BEFORE: ${{ github.event.before }}
          SHA: ${{ github.sha }}
        run: |
          set -uo pipefail
          ZERO=0000000000000000000000000000000000000000
          if [ -n "${BEFORE:-}" ] && [ "$BEFORE" != "$ZERO" ] && git cat-file -e "$BEFORE^{commit}" 2>/dev/null; then
            commits=$(git rev-list "$BEFORE..$SHA")
          else
            commits=$(git rev-list -1 "$SHA")
          fi

          status=0
          for c in $commits; do
            # message body, author email, committer email
            meta=$(git log -1 --format='%B%n%ae%n%ce' "$c")
            if printf '%s' "$meta" | grep -qiE 'co-authored-by:.*(claude|anthropic)|claude-session:|noreply@anthropic\.com'; then
              subject=$(git log -1 --format='%s' "$c")
              echo "::error::$c ($subject) carries assistant attribution — see CLAUDE.md"
              status=1
            fi
          done

          if [ "$status" -eq 0 ]; then
            echo "All checked commits comply."
          fi
          exit $status
